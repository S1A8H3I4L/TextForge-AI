services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: textforge
      POSTGRES_PASSWORD: textforge
      POSTGRES_DB: textforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textforge"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://textforge:textforge@db:5432/textforge
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      DATA_DIR: /app/data
      ARTIFACTS_DIR: /app/artifacts
      DATASET_PATH: /app/data/shakespeare.txt
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
